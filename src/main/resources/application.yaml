spring:
  application:
    name: insurance-service
  datasource:
    driver-class-name: org.postgresql.Driver
    username: admin
    password: qwerty
    url: jdbc:postgresql://localhost:5432/dev_insurance_db
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgresSQLDialect
        format_sql: true
    database: postgresql
  liquibase:
    change-log: db/changelog/changelog-master.yaml
    enabled: true
    default-schema: public
    liquibase-schema: public
